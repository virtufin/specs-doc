<div class="md-source-wrapper">
  <a href="{{ config.repo_url }}" title="{{ lang.t('source') }}" class="md-source-repo-link">
    <div class="md-source__icon md-icon">
      {% set icon = config.theme.icon.repo or "fontawesome/brands/git-alt" %}
      {% include ".icons/" ~ icon ~ ".svg" %}
    </div>
    <span class="md-source__repository">{{ config.repo_name }}</span>
  </a>
  {%- if config.extra.commit_sha and config.extra.commit_sha != "__COMMIT_SHA__" %}
    <a href="{{ config.repo_url }}/commit/{{ config.extra.commit_sha }}"
       class="md-source-commit-badge"
       target="_blank"
       rel="noopener"
       title="View commit {{ config.extra.commit_sha[:7] }}">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 82 22" width="82" height="22" style="vertical-align:middle;">
        <rect width="82" height="22" rx="4" fill="#e9ecef" stroke="currentColor" stroke-width="0.75" opacity="0.6"/>
        <text x="41" y="15.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="600" fill="currentColor">{{ config.extra.commit_sha[:7] }}</text>
      </svg>
    </a>
  {%- endif %}
</div>
